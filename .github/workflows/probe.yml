name: Probe (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://www.re.or.kr/bid/listBidResultPage.do" "https://www.re.or.kr/bid/viewBidResultPage.do?bidAdNum=20260928003&bidTimeNum=0" \
                   "https://www.recycling-info.or.kr/sds/marketIndex.do?menuNo=M130301" \
                   "https://apis.data.go.kr/1230000/ad/BidPublicInfoService/getBidPblancListInfoServc?numOfRows=1&pageNo=1&type=json" \
                   "https://www.law.go.kr/DRF/lawSearch.do?target=law&query=%EC%9E%90%EC%9B%90%EC%9E%AC%ED%99%9C%EC%9A%A9" \
                   "https://www.mcee.go.kr/" "https://www.me.go.kr/home/web/board/list.do?menuId=10525"; do
            code=$(curl -s -m 25 -A "Mozilla/5.0" -o /tmp/p.html -w "%{http_code}" "$u"); 
            echo "== $code $(wc -c </tmp/p.html)B $u"; grep -o "<title>[^<]*" /tmp/p.html | head -1; head -c 300 /tmp/p.html | tr '\n' ' '; echo; 
            grep -o "245 (원/kg)\|낙찰\|매각" /tmp/p.html | sort | uniq -c | head -3
          done
