name: Bids & Policy Collect
on:
  schedule:
    - cron: '5 22 * * *'   # 매일 07:05 KST
    - cron: '5 4 * * *'    # 매일 13:05 KST
    - cron: '5 9 * * *'    # 매일 18:05 KST
  workflow_dispatch:
permissions:
  contents: write
  issues: write
concurrency:
  group: market
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 폐플라스틱 매각입찰 수집 (순환자원정보센터·나라장터)
        continue-on-error: true
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: mkdir -p logs && python -u collect_bids.py 2>&1 | tee logs/bids.log
      - name: 제도 변경 감시 (법령정보·기후에너지환경부)
        continue-on-error: true
        env:
          LAW_API_KEY: ${{ secrets.LAW_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -u collect_policy.py 2>&1 | tee logs/policy.log
      - name: 변경 저장
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data logs
          git diff --staged --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "Auto: bids/policy [$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')]"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && exit 0
            echo "push 재시도 $i/5"; sleep 5
          done
          exit 1
